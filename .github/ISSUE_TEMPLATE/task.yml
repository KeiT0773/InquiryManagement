name: その他作業
description: 環境整備、リファクタリング、文書整備、テスト追加など
title: "chore: "
body:
  - type: dropdown
    id: kind
    attributes:
      label: 作業の種別
      description: ここで選んだ種別が、そのままブランチ名の先頭になります。
      options:
        - docs（文書のみの変更）
        - refactor（挙動を変えない内部改善）
        - test（テストの追加・修正）
        - chore（ビルド設定・依存関係・開発環境）
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 作業内容
      description: 何を、なぜ行うのかを書きます。
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 完了条件
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
