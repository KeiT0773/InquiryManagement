name: 機能追加
description: 新しい機能を実装する
title: "feat: "
labels: ["type:feat"]
body:
  - type: markdown
    attributes:
      value: |
        機能を追加するときはこのテンプレートを使います。
        作業を始める前に、[機能要件書](https://github.com/KeiT0773/InquiryManagement/blob/main/docs/functional-requirements.md) の該当箇所を確認してください。

  - type: dropdown
    id: feature-id
    attributes:
      label: 関連する機能 ID
      description: 機能要件書で定義された機能 ID を選びます。該当がなければ「該当なし（新規）」を選び、背景欄に理由を書いてください。
      options:
        - FR-01 問い合わせ登録
        - FR-02 問い合わせ編集
        - FR-03 問い合わせ削除
        - FR-04 ステータス変更
        - FR-05 問い合わせの並べ替え
        - FR-06 対応者の設定
        - FR-07 対応期限の設定
        - FR-08 優先度の設定
        - FR-09 データ保存
        - FR-10 全リストの優先度順並べ替え
        - 該当なし（新規）
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 背景・目的
      description: なぜこの機能が必要なのか、何を解決するのかを書きます。
      placeholder: |
        例：問い合わせを登録するたびに手で並べ替えており手間がかかる。登録時に優先度を選べるようにしたい。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ基準
      description: 「これができていれば完了」と言える条件を箇条書きで書きます。
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 影響範囲
      description: 変更が及ぶ画面・API・テーブル・文書など、分かる範囲で書きます。
      placeholder: |
        例：SC-01 ボード画面、inquiries テーブル、docs/data-design.md
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      options:
        - 高
        - 中
        - 低
      default: 1
    validations:
      required: true
