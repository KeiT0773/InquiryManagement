# 日本語の辞書（API 設計書 2.1）。入力チェックのメッセージは「<項目名><メッセージ>」の形にする。
#   例：件名を入力してください、件名は100文字以内で入力してください
ja:
  activerecord:
    models:
      inquiry: "問い合わせ"
      list: "リスト"
    attributes:
      inquiry:
        title: "件名"
        customer_name: "問い合わせ者"
        contact: "連絡先"
        category: "種別"
        content: "問い合わせ内容"
        memo: "対応メモ"
        assignee: "対応者"
        received_on: "受付日"
        due_on: "対応期限"
        priority: "優先度"
        list: "所属リスト"
        display_order: "表示順"
      list:
        name: "名称"
        display_order: "並び順"
  errors:
    format: "%{attribute}%{message}"
    messages:
      blank: "を入力してください"
      required: "を入力してください"
      empty: "を入力してください"
      too_long: "は%{count}文字以内で入力してください"
      inclusion: "は一覧にない値です"
      invalid: "は不正な値です"
      not_a_number: "は数値で指定してください"
      not_an_integer: "は整数で指定してください"
      greater_than_or_equal_to: "は%{count}以上で指定してください"
